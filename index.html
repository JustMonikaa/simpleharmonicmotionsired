<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Physics Simulation: Harmonic Motion</title>
    
    <!-- Load PyScript to run Python in the browser -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    
    <style>
        body { 
            background-color: #1e1e1e; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
            color: white;
            font-family: sans-serif;
        }
        /* Removes the default PyScript loading spinner overlay for a cleaner look */
        .py-overlay { display: none; }
        canvas {
            border: 2px solid #505050;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <!-- Configure PyScript to install the community edition of Pygame -->
    <py-config>
        packages = ["pygame-ce"]
    </py-config>
    
    <!-- This calls your external Python script -->
    <script type="py" src="./main.py"></script>
</body>
</html>
